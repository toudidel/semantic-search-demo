services:
  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: embedding-service

    ports:
      - "8090:8080"

    environment:
      MODEL_NAME: BAAI/bge-m3
      MAX_LENGTH: 2048
      BATCH_SIZE: 16

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    restart: unless-stopped

volumes:
  huggingface-cache: