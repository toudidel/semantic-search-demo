spring:
  application:
    name: semantic-search-demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:semantic_search}
    username: ${DB_USER:semantic}
    password: ${DB_PASSWORD:semantic}
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

app:
  embedding:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info
