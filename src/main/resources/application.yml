spring:
  application:
    name: semantic-search-demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:semantic_search}
    username: ${DB_USER:semantic}
    password: ${DB_PASSWORD:semantic}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}

app:
  embedding:
    base-url: ${EMBEDDING_API_BASE_URL:http://localhost:8090}
    endpoint: ${EMBEDDING_API_ENDPOINT:/embeddings}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info
