services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: semantic-search-postgres
    environment:
      POSTGRES_DB: semantic_search
      POSTGRES_USER: semantic
      POSTGRES_PASSWORD: semantic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantic -d semantic_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
